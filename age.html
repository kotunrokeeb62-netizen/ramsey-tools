<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramsey Age Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
      min-height: 100vh;
      transition: 0.3s;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 27px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
    }

    .container {
      width: 92%;
      max-width: 500px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      transition: 0.3s;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
      background: white;
      color: #222;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      background: #f1f5ff;
      border-radius: 12px;
      display: none;
      text-align: center;
    }

    .result h2 {
      color: #2563eb;
      margin-bottom: 12px;
    }

    .result p {
      margin: 8px 0;
      font-size: 15px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .error {
      color: #dc2626;
      margin-top: 10px;
      text-align: center;
    }

    /* GLOBAL DARK MODE */

    body.dark {
      background: #111827;
      color: #f9fafb;
    }

    body.dark .card {
      background: #1f2937;
    }

    body.dark input {
      background: #111827;
      color: white;
      border-color: #374151;
    }

    body.dark .result {
      background: #273449;
    }

    body.dark .result h2 {
      color: #60a5fa;
    }

    body.dark .back {
      color: #60a5fa;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎂 Ramsey Age Calculator</h1>
    <p>Find your exact age</p>
  </header>

  <main class="container">

    <div class="card">

      <label for="birthDate">
        Enter your date of birth
      </label>

      <input
        type="date"
        id="birthDate"
      >

      <button onclick="calculateAge()">
        Calculate Age
      </button>

      <div id="result" class="result">

        <h2>Your Age</h2>

        <p id="age"></p>

        <p id="birthday"></p>

      </div>

      <p id="error" class="error"></p>

      <a
        href="index.html"
        class="back"
      >
        ← Back to Ramsey Tools
      </a>

    </div>

  </main>

  <script>

    /* AGE CALCULATOR */

    function calculateAge() {

      const birthInput =
        document.getElementById("birthDate").value;

      const result =
        document.getElementById("result");

      const error =
        document.getElementById("error");


      error.textContent = "";

      result.style.display = "none";


      if (!birthInput) {

        error.textContent =
          "Please enter your date of birth.";

        return;

      }


      const birthDate =
        new Date(
          birthInput + "T00:00:00"
        );

      const today =
        new Date();


      if (birthDate > today) {

        error.textContent =
          "Your date of birth cannot be in the future.";

        return;

      }


      let years =
        today.getFullYear()
        - birthDate.getFullYear();


      let months =
        today.getMonth()
        - birthDate.getMonth();


      let days =
        today.getDate()
        - birthDate.getDate();


      if (days < 0) {

        months--;


        const previousMonth =
          new Date(
            today.getFullYear(),
            today.getMonth(),
            0
          );


        days +=
          previousMonth.getDate();

      }


      if (months < 0) {

        years--;

        months += 12;

      }


      document.getElementById("age").textContent =
        `${years} years, ${months} months, ${days} days old`;


      let nextBirthday =
        new Date(
          today.getFullYear(),
          birthDate.getMonth(),
          birthDate.getDate()
        );


      if (nextBirthday < today) {

        nextBirthday =
          new Date(
            today.getFullYear() + 1,
            birthDate.getMonth(),
            birthDate.getDate()
          );

      }


      const difference =
        nextBirthday - today;


      const daysUntil =
        Math.ceil(
          difference /
          (1000 * 60 * 60 * 24)
        );


      document.getElementById("birthday").textContent =

        daysUntil === 0

          ? "🎉 Happy Birthday!"

          : `${daysUntil} days until your next birthday`;


      result.style.display = "block";

    }


    /* GLOBAL THEME */

    function loadGlobalTheme() {

      const savedTheme =
        localStorage.getItem(
          "ramseyTheme"
        );


      if (savedTheme === "dark") {

        document.body.classList.add("dark");

      }

    }


    loadGlobalTheme();

  </script>

</body>
</html>
