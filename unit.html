<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ramsey Unit Converter</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
      min-height: 100vh;
      transition: 0.3s;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 22px 15px;
    }

    header h1 {
      font-size: 27px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
    }

    .container {
      width: 92%;
      max-width: 550px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      transition: 0.3s;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
      background: white;
      color: #222;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .swap {
      background: #16a34a;
      margin-bottom: 15px;
    }

    .result {
      background: #f1f5ff;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      margin-top: 5px;
    }

    .result h2 {
      color: #2563eb;
      font-size: 15px;
      margin-bottom: 8px;
    }

    #result {
      font-size: 25px;
      font-weight: bold;
      word-break: break-word;
    }

    .back {
      display: block;
      text-align: center;
      margin: 20px 0;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    /* GLOBAL DARK MODE */

    body.dark {
      background: #111827;
      color: #f9fafb;
    }

    body.dark .card {
      background: #1f2937;
    }

    body.dark input,
    body.dark select {
      background: #111827;
      color: white;
      border-color: #374151;
    }

    body.dark .result {
      background: #273449;
    }

    body.dark .result h2 {
      color: #60a5fa;
    }

    body.dark .back {
      color: #60a5fa;
    }
  </style>
</head>

<body>

  <header>
    <h1>📏 Ramsey Unit Converter</h1>
    <p>Convert units quickly and easily</p>
  </header>


  <main class="container">

    <div class="card">

      <label for="category">
        Conversion Type
      </label>

      <select id="category">

        <option value="length">
          📏 Length
        </option>

        <option value="weight">
          ⚖️ Weight
        </option>

        <option value="temperature">
          🌡️ Temperature
        </option>

        <option value="volume">
          🧴 Volume
        </option>

        <option value="time">
          ⏱️ Time
        </option>

      </select>


      <label for="value">
        Enter Value
      </label>

      <input
        id="value"
        type="number"
        step="any"
        placeholder="Enter value"
      >


      <label for="fromUnit">
        From
      </label>

      <select id="fromUnit"></select>


      <label for="toUnit">
        To
      </label>

      <select id="toUnit"></select>


      <button
        id="swapButton"
        class="swap"
        type="button"
      >
        ↔️ Swap Units
      </button>


      <div class="result">

        <h2>RESULT</h2>

        <p id="result">0</p>

      </div>

    </div>


    <a
      href="index.html"
      class="back"
    >
      ← Back to Ramsey Tools
    </a>

  </main>


  <script>

    /* UNIT DATA */

    const units = {

      length: {

        "Meter (m)": 1,
        "Kilometer (km)": 1000,
        "Centimeter (cm)": 0.01,
        "Millimeter (mm)": 0.001,
        "Inch (in)": 0.0254,
        "Foot (ft)": 0.3048,
        "Yard (yd)": 0.9144,
        "Mile (mi)": 1609.344

      },


      weight: {

        "Kilogram (kg)": 1,
        "Gram (g)": 0.001,
        "Milligram (mg)": 0.000001,
        "Pound (lb)": 0.45359237,
        "Ounce (oz)": 0.028349523125

      },


      volume: {

        "Liter (L)": 1,
        "Milliliter (mL)": 0.001,
        "US Gallon": 3.785411784,
        "US Cup": 0.2365882365,
        "Cubic Meter (m³)": 1000

      },


      time: {

        "Second": 1,
        "Minute": 60,
        "Hour": 3600,
        "Day": 86400,
        "Week": 604800

      }

    };


    const temperatureUnits = [
      "Celsius (°C)",
      "Fahrenheit (°F)",
      "Kelvin (K)"
    ];


    /* ELEMENTS */

    const category =
      document.getElementById("category");

    const valueInput =
      document.getElementById("value");

    const fromUnit =
      document.getElementById("fromUnit");

    const toUnit =
      document.getElementById("toUnit");

    const result =
      document.getElementById("result");

    const swapButton =
      document.getElementById("swapButton");


    /* LOAD UNITS */

    function loadUnits() {

      const type = category.value;

      fromUnit.innerHTML = "";
      toUnit.innerHTML = "";

      let list;


      if (type === "temperature") {

        list = temperatureUnits;

      } else {

        list = Object.keys(units[type]);

      }


      list.forEach(function(unit) {

        const fromOption =
          document.createElement("option");

        fromOption.value = unit;
        fromOption.textContent = unit;

        fromUnit.appendChild(fromOption);


        const toOption =
          document.createElement("option");

        toOption.value = unit;
        toOption.textContent = unit;

        toUnit.appendChild(toOption);

      });


      if (list.length > 1) {

        toUnit.selectedIndex = 1;

      }


      convert();

    }


    /* TEMPERATURE */

    function convertTemperature(
      number,
      from,
      to
    ) {

      let celsius;


      if (from === "Celsius (°C)") {

        celsius = number;

      }

      else if (
        from === "Fahrenheit (°F)"
      ) {

        celsius =
          (number - 32) * 5 / 9;

      }

      else {

        celsius =
          number - 273.15;

      }


      if (to === "Celsius (°C)") {

        return celsius;

      }


      if (
        to === "Fahrenheit (°F)"
      ) {

        return (
          celsius * 9 / 5
        ) + 32;

      }


      return celsius + 273.15;

    }


    /* CONVERT */

    function convert() {

      const number =
        parseFloat(valueInput.value);


      if (Number.isNaN(number)) {

        result.textContent = "0";

        return;

      }


      const type =
        category.value;

      const from =
        fromUnit.value;

      const to =
        toUnit.value;


      let answer;


      if (
        type === "temperature"
      ) {

        answer =
          convertTemperature(
            number,
            from,
            to
          );

      }

      else {

        const baseValue =
          number * units[type][from];

        answer =
          baseValue / units[type][to];

      }


      result.textContent =
        Number(
          answer.toFixed(10)
        ).toLocaleString("en-US");

    }


    /* SWAP */

    swapButton.addEventListener(
      "click",
      function() {

        const currentFrom =
          fromUnit.value;

        const currentTo =
          toUnit.value;


        fromUnit.value =
          currentTo;

        toUnit.value =
          currentFrom;


        convert();

      }
    );


    /* EVENTS */

    category.addEventListener(
      "change",
      loadUnits
    );


    valueInput.addEventListener(
      "input",
      convert
    );


    fromUnit.addEventListener(
      "change",
      convert
    );


    toUnit.addEventListener(
      "change",
      convert
    );


    /* READ GLOBAL THEME */

    function loadGlobalTheme() {

      const savedTheme =
        localStorage.getItem(
          "ramseyTheme"
        );


      if (
        savedTheme === "dark"
      ) {

        document.body.classList.add(
          "dark"
        );

      }

    }


    loadGlobalTheme();

    loadUnits();

  </script>

</body>
</html>
