<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ramsey Password Generator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
    }

    .container {
      width: 92%;
      max-width: 550px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 18px;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .password-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    #password {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      background: #f9fafb;
      color: #222;
    }

    .copy-btn {
      width: auto;
      padding: 12px 15px;
      border: none;
      border-radius: 10px;
      background: #16a34a;
      color: white;
      font-weight: bold;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .length-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #2563eb;
    }

    #lengthValue {
      font-weight: bold;
      min-width: 30px;
      text-align: center;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 13px 0;
    }

    .option input {
      width: 20px;
      height: 20px;
      accent-color: #2563eb;
    }

    .option label {
      margin: 0;
      font-weight: normal;
    }

    .generate-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 8px;
    }

    .strength {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      background: #f1f5ff;
      color: #2563eb;
    }

    .error {
      color: #dc2626;
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }

    .back {
      display: block;
      text-align: center;
      margin: 20px 0;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    button {
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    /* DARK MODE */

    body.dark {
      background: #111827;
      color: #f9fafb;
    }

    body.dark .card {
      background: #1f2937;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    body.dark #password {
      background: #111827;
      color: #f9fafb;
      border-color: #374151;
    }

    body.dark #password::placeholder {
      color: #9ca3af;
    }

    body.dark .strength {
      background: #273449;
    }

    body.dark .back {
      color: #60a5fa;
    }

    @media (max-width: 450px) {
      .password-box {
        flex-direction: column;
      }

      .copy-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🔐 Ramsey Password Generator</h1>
    <p>Create strong passwords instantly</p>
  </header>

  <main class="container">

    <!-- PASSWORD DISPLAY -->

    <div class="card">

      <div class="password-box">

        <input
          type="text"
          id="password"
          readonly
          placeholder="Your password appears here"
        >

        <button
          class="copy-btn"
          onclick="copyPassword()"
        >
          📋 Copy
        </button>

      </div>

      <div
        id="strength"
        class="strength"
      >
        Generate a password
      </div>

    </div>


    <!-- SETTINGS -->

    <div class="card">

      <label>
        Password Length
      </label>

      <div class="length-row">

        <input
          type="range"
          id="length"
          min="6"
          max="50"
          value="16"
        >

        <span id="lengthValue">
          16
        </span>

      </div>


      <div class="option">

        <input
          type="checkbox"
          id="uppercase"
          checked
        >

        <label for="uppercase">
          Uppercase letters (A-Z)
        </label>

      </div>


      <div class="option">

        <input
          type="checkbox"
          id="lowercase"
          checked
        >

        <label for="lowercase">
          Lowercase letters (a-z)
        </label>

      </div>


      <div class="option">

        <input
          type="checkbox"
          id="numbers"
          checked
        >

        <label for="numbers">
          Numbers (0-9)
        </label>

      </div>


      <div class="option">

        <input
          type="checkbox"
          id="symbols"
          checked
        >

        <label for="symbols">
          Symbols (!@#$)
        </label>

      </div>


      <button
        class="generate-btn"
        onclick="generatePassword()"
      >
        🎲 Generate Password
      </button>

      <p
        id="error"
        class="error"
      ></p>

    </div>


    <a href="index.html" class="back">
      ← Back to Ramsey Tools
    </a>

  </main>


  <script>

    /* =========================
       GLOBAL THEME
       ========================= */

    function loadGlobalTheme() {

      const savedTheme =
        localStorage.getItem("ramseyTheme");

      if (savedTheme === "dark") {

        document.body.classList.add("dark");

      }

    }


    /* LOAD THEME */

    loadGlobalTheme();


    /* =========================
       PASSWORD GENERATOR
       ========================= */

    const lengthInput =
      document.getElementById("length");

    const lengthValue =
      document.getElementById("lengthValue");


    /* UPDATE LENGTH */

    lengthInput.addEventListener(
      "input",
      function() {

        lengthValue.textContent =
          lengthInput.value;

      }
    );


    /* GENERATE PASSWORD */

    function generatePassword() {

      const length =
        Number(lengthInput.value);

      const useUppercase =
        document.getElementById(
          "uppercase"
        ).checked;

      const useLowercase =
        document.getElementById(
          "lowercase"
        ).checked;

      const useNumbers =
        document.getElementById(
          "numbers"
        ).checked;

      const useSymbols =
        document.getElementById(
          "symbols"
        ).checked;

      const error =
        document.getElementById("error");

      error.textContent = "";


      let characters = "";

      let password = "";


      if (useUppercase) {

        characters +=
          "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

      }

      if (useLowercase) {

        characters +=
          "abcdefghijklmnopqrstuvwxyz";

      }

      if (useNumbers) {

        characters +=
          "0123456789";

      }

      if (useSymbols) {

        characters +=
          "!@#$%^&*()_+-=[]{}|;:,.<>?";

      }


      if (!characters) {

        error.textContent =
          "Select at least one character type.";

        return;

      }


      /* MAKE SURE EACH SELECTED TYPE CAN APPEAR */

      const selectedSets = [];


      if (useUppercase) {

        selectedSets.push(
          "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        );

      }

      if (useLowercase) {

        selectedSets.push(
          "abcdefghijklmnopqrstuvwxyz"
        );

      }

      if (useNumbers) {

        selectedSets.push(
          "0123456789"
        );

      }

      if (useSymbols) {

        selectedSets.push(
          "!@#$%^&*()_+-=[]{}|;:,.<>?"
        );

      }


      /* ADD ONE FROM EACH SELECTED TYPE */

      selectedSets.forEach(set => {

        password +=
          set[
            Math.floor(
              Math.random() * set.length
            )
          ];

      });


      /* FILL REMAINING CHARACTERS */

      while (
        password.length < length
      ) {

        password +=
          characters[
            Math.floor(
              Math.random() * characters.length
            )
          ];

      }


      /* SHUFFLE PASSWORD */

      password =
        password
          .split("")
          .sort(
            () => Math.random() - 0.5
          )
          .join("");


      document.getElementById(
        "password"
      ).value = password;


      showStrength(password);

    }


    /* PASSWORD STRENGTH */

    function showStrength(password) {

      const strength =
        document.getElementById("strength");

      let score = 0;


      if (password.length >= 12) {

        score++;

      }

      if (/[A-Z]/.test(password)) {

        score++;

      }

      if (/[a-z]/.test(password)) {

        score++;

      }

      if (/[0-9]/.test(password)) {

        score++;

      }

      if (
        /[^A-Za-z0-9]/.test(password)
      ) {

        score++;

      }


      if (score <= 2) {

        strength.textContent =
          "⚠️ Weak Password";

      } else if (score === 3) {

        strength.textContent =
          "🟡 Medium Password";

      } else if (score === 4) {

        strength.textContent =
          "🟢 Strong Password";

      } else {

        strength.textContent =
          "🔥 Very Strong Password";

      }

    }


    /* COPY PASSWORD */

    async function copyPassword() {

      const password =
        document.getElementById(
          "password"
        ).value;

      if (!password) {

        return;

      }


      try {

        await navigator.clipboard.writeText(
          password
        );

        alert("Password copied!");

      } catch (error) {

        alert(
          "Copy failed. Please copy it manually."
        );

      }

    }


    /* GENERATE ONE WHEN PAGE OPENS */

    generatePassword();

  </script>

</body>
</html>
