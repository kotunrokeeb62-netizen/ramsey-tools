<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ramsey To-Do List</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
    }

    .container {
      width: 92%;
      max-width: 550px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 18px;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      background: white;
      color: #222;
    }

    .add-btn {
      width: auto;
      padding: 13px 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .stat {
      background: #f1f5ff;
      padding: 13px 6px;
      border-radius: 12px;
      text-align: center;
      transition: background 0.3s;
    }

    .stat strong {
      display: block;
      font-size: 20px;
      color: #2563eb;
      margin-bottom: 4px;
    }

    .stat span {
      font-size: 12px;
      color: #666;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .task:last-child {
      border-bottom: none;
    }

    .task-checkbox {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      accent-color: #2563eb;
    }

    .task-text {
      flex: 1;
      min-width: 0;
      font-size: 15px;
      word-break: break-word;
    }

    .task.completed .task-text {
      text-decoration: line-through;
      color: #888;
    }

    .delete-btn {
      width: auto;
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      background: #dc2626;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 15px 0;
    }

    .clear-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #dc2626;
      color: white;
      font-size: 15px;
      font-weight: bold;
      margin-top: 15px;
    }

    .back {
      display: block;
      text-align: center;
      margin: 20px 0;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    /* DARK MODE */

    body.dark {
      background: #111827;
      color: #f9fafb;
    }

    body.dark .card {
      background: #1f2937;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    body.dark input {
      background: #111827;
      color: #f9fafb;
      border-color: #374151;
    }

    body.dark input::placeholder {
      color: #9ca3af;
    }

    body.dark .stat {
      background: #273449;
    }

    body.dark .stat span {
      color: #9ca3af;
    }

    body.dark .task {
      border-color: #374151;
    }

    body.dark .task.completed .task-text {
      color: #9ca3af;
    }

    body.dark .empty {
      color: #9ca3af;
    }

    body.dark .back {
      color: #60a5fa;
    }

    @media (max-width: 450px) {
      .input-row {
        flex-direction: column;
      }

      .add-btn {
        width: 100%;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>📝 Ramsey To-Do List</h1>
    <p>Organize your daily tasks</p>
  </header>

  <main class="container">

    <!-- STATS -->

    <div class="stats">

      <div class="stat">
        <strong id="totalTasks">0</strong>
        <span>Total</span>
      </div>

      <div class="stat">
        <strong id="completedTasks">0</strong>
        <span>Completed</span>
      </div>

      <div class="stat">
        <strong id="remainingTasks">0</strong>
        <span>Remaining</span>
      </div>

    </div>


    <!-- ADD TASK -->

    <div class="card">

      <div class="input-row">

        <input
          type="text"
          id="taskInput"
          placeholder="Enter a task..."
        >

        <button
          class="add-btn"
          onclick="addTask()"
        >
          Add
        </button>

      </div>

    </div>


    <!-- TASKS -->

    <div class="card">

      <div id="taskList">

        <p class="empty">
          No tasks yet. Add your first task!
        </p>

      </div>

      <button
        class="clear-btn"
        onclick="clearCompleted()"
      >
        Clear Completed
      </button>

    </div>


    <a href="index.html" class="back">
      ← Back to Ramsey Tools
    </a>

  </main>


  <script>

    /* =========================
       GLOBAL THEME
       ========================= */

    function loadGlobalTheme() {

      const savedTheme =
        localStorage.getItem("ramseyTheme");

      if (savedTheme === "dark") {

        document.body.classList.add("dark");

      }

    }


    /* LOAD THEME */

    loadGlobalTheme();


    /* =========================
       TASK DATA
       ========================= */

    let tasks =
      JSON.parse(
        localStorage.getItem("ramseyTasks")
      ) || [];


    /* SAVE TASKS */

    function saveTasks() {

      localStorage.setItem(
        "ramseyTasks",
        JSON.stringify(tasks)
      );

    }


    /* ADD TASK */

    function addTask() {

      const input =
        document.getElementById("taskInput");

      const text =
        input.value.trim();

      if (!text) {

        return;

      }

      const task = {

        id: Date.now(),

        text: text,

        completed: false

      };

      tasks.unshift(task);

      saveTasks();

      input.value = "";

      renderTasks();

      input.focus();

    }


    /* ENTER KEY */

    document
      .getElementById("taskInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            addTask();

          }

        }
      );


    /* TOGGLE TASK */

    function toggleTask(id) {

      tasks =
        tasks.map(task => {

          if (task.id === id) {

            return {
              ...task,
              completed: !task.completed
            };

          }

          return task;

        });

      saveTasks();

      renderTasks();

    }


    /* DELETE TASK */

    function deleteTask(id) {

      tasks =
        tasks.filter(
          task => task.id !== id
        );

      saveTasks();

      renderTasks();

    }


    /* CLEAR COMPLETED */

    function clearCompleted() {

      tasks =
        tasks.filter(
          task => !task.completed
        );

      saveTasks();

      renderTasks();

    }


    /* DISPLAY TASKS */

    function renderTasks() {

      const container =
        document.getElementById("taskList");

      const total =
        tasks.length;

      const completed =
        tasks.filter(
          task => task.completed
        ).length;

      const remaining =
        total - completed;


      document.getElementById(
        "totalTasks"
      ).textContent = total;


      document.getElementById(
        "completedTasks"
      ).textContent = completed;


      document.getElementById(
        "remainingTasks"
      ).textContent = remaining;


      if (tasks.length === 0) {

        container.innerHTML =
          '<p class="empty">No tasks yet. Add your first task!</p>';

        return;

      }


      container.innerHTML = "";


      tasks.forEach(task => {

        const item =
          document.createElement("div");

        item.className =
          "task" +
          (
            task.completed
              ? " completed"
              : ""
          );


        const checkbox =
          document.createElement("input");

        checkbox.type = "checkbox";

        checkbox.className =
          "task-checkbox";

        checkbox.checked =
          task.completed;

        checkbox.addEventListener(
          "change",
          () => toggleTask(task.id)
        );


        const text =
          document.createElement("div");

        text.className =
          "task-text";

        text.textContent =
          task.text;


        const deleteButton =
          document.createElement("button");

        deleteButton.className =
          "delete-btn";

        deleteButton.textContent =
          "Delete";

        deleteButton.addEventListener(
          "click",
          () => deleteTask(task.id)
        );


        item.appendChild(checkbox);

        item.appendChild(text);

        item.appendChild(deleteButton);

        container.appendChild(item);

      });

    }


    /* START */

    renderTasks();

  </script>

</body>
</html>
